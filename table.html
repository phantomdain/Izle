<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

<header class="site-header" id="siteHeader">
  <a href="index.html" class="site-header__mark">18</a>
  <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
</header>
<nav class="site-nav" id="siteNav">
  <button class="site-nav__close" id="navClose" aria-label="Close menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <a href="index.html#details" class="nav-link">Details</a>
  <a href="index.html#rsvp" class="nav-link">RSVP</a>
  <a href="table.html" class="nav-link">Find My Table</a>
</nav>

<main>
  <section class="hero" style="min-height: 60svh;">
    <div class="hero__ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    </div>
    <span class="hero__eyebrow">Seating</span>
    <h1 class="hero__title" style="font-size: clamp(2.2rem, 9vw, 3.4rem);">Find My Table</h1>
    <p class="hero__date">Enter the name you RSVP'd with to find your seat.</p>
  </section>

  <section class="section">
    <div class="container">
      <div class="finder">
        <div class="finder__row">
          <input type="text" id="finderInput" placeholder="Type your full name…" autocomplete="name" aria-label="Your name">
          <button type="button" class="btn btn--primary" id="finderButton">Search</button>
        </div>
        <p class="finder-note">Tip: try just your first or last name if the full name doesn't match.</p>
      </div>

      <div class="finder-result" id="finderResult" aria-live="polite"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p class="site-footer__meta">
    <a href="index.html">&larr; Back to the invitation</a>
  </p>
</footer>

<script src="js/config.js?v=1"></script>
